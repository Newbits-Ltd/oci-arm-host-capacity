name: OCI Provisioner
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:  # allows manual trigger from Actions tab

jobs:
  provision:
    runs-on: ubuntu-latest
    name: Try to create A1 instance
    steps:
      - uses: actions/checkout@v3

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Write private key to file
        run: |
          cat << 'EOF' > /tmp/oci_private_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          chmod 600 /tmp/oci_private_key.pem

      - name: Debug config
        run: |
          echo "Region: $OCI_REGION"
          echo "User: $OCI_USER_ID"
          echo "Tenancy: $OCI_TENANCY_ID"
          echo "Fingerprint: $OCI_KEY_FINGERPRINT"
          echo "Key file exists: $(test -f /tmp/oci_private_key.pem && echo YES || echo NO)"
          echo "Key first line: $(head -1 /tmp/oci_private_key.pem)"
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}

      - name: Run provisioner
        run: php index.php
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /tmp/oci_private_key.pem
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_SHAPE: ${{ secrets.OCI_SHAPE }}
          OCI_MAX_INSTANCES: ${{ secrets.OCI_MAX_INSTANCES }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
